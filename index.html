<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flint</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #0a0a0a 0%, #1a0a12 50%, #ff6b9d 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Логотип */
        .logo {
            width: 200px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* Приветствие */
        .greeting {
            font-size: 28px;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Секции */
        .section-title {
            width: 100%;
            max-width: 400px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            margin-top: 10px;
        }

        /* Карточки */
        .card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.1);
        }

        .card-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .card-text {
            flex: 1;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 13px;
            color: #aaa;
            line-height: 1.3;
        }

        .card-arrow {
            font-size: 20px;
            color: #666;
        }

        /* Навигация внизу */
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
            flex: 1;
        }

        .nav-item.active {
            opacity: 1;
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 11px;
            color: #fff;
        }

        .nav-item.active .nav-label {
            color: #ff6b9d;
        }
    </style>
</head>
<body>
    <!-- Логотип -->
    <img src="logo.png" alt="FLINT" class="logo" id="logo">

    <!-- Приветствие -->
    <div class="greeting" id="greeting">Привет!</div>

    <!-- Умная подборка -->
    <div class="section-title">Лучшее</div>

    <div class="card" onclick="askQuestion()">
        <div class="card-icon">💬</div>
        <div class="card-text">
            <div class="card-title">Задай любой вопрос</div>
            <div class="card-subtitle">Помогу во всём разобраться</div>
        </div>
        <div class="card-arrow">›</div>
    </div>

    <div class="card" onclick="generateImage()">
        <div class="card-icon">🎨</div>
        <div class="card-text">
            <div class="card-title">Сгенерируй картинку</div>
            <div class="card-subtitle">Опиши, что хочешь увидеть</div>
        </div>
        <div class="card-arrow">›</div>
    </div>

    <div class="card" onclick="checkBalance()">
        <div class="card-icon">
            <img src="token.png" style="width: 28px; height: 28px; border-radius: 50%;">
        </div>
        <div class="card-text">
            <div class="card-title">Твой баланс</div>
            <div class="card-subtitle" id="balance-text">100 токенов</div>
        </div>
        <div class="card-arrow">›</div>
    </div>

    <!-- Основное -->
    <div class="section-title" style="margin-top: 24px;">Основное</div>

    <div class="card" onclick="openReferral()">
        <div class="card-icon">🔗</div>
        <div class="card-text">
            <div class="card-title">Рефералка</div>
            <div class="card-subtitle">Приглашай друзей, получай токены</div>
        </div>
        <div class="card-arrow">›</div>
    </div>

    <div class="card" onclick="openHistory()">
        <div class="card-icon">📜</div>
        <div class="card-text">
            <div class="card-title">История</div>
            <div class="card-subtitle">Твои прошлые запросы</div>
        </div>
        <div class="card-arrow">›</div>
    </div>

    <!-- Навигация -->
    <div class="nav">
        <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Главная</div>
        </div>
        <div class="nav-item" onclick="goToDiscover()">
            <div class="nav-icon">🔍</div>
            <div class="nav-label">Открытия</div>
        </div>
        <div class="nav-item" onclick="goToGenerate()">
            <div class="nav-icon">🎨</div>
            <div class="nav-label">Генерация</div>
        </div>
        <div class="nav-item" onclick="goToSettings()">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label">Настройки</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем имя пользователя
        const user = tg.initDataUnsafe?.user;
        if (user && user.first_name) {
            document.getElementById('greeting').textContent = `Привет, ${user.first_name}!`;
        }

        // Умная подборка — заглушка. Позже будет запрос к API.
        // Например: если утро → "Дайджест", если мало токенов → "Пополнить"

        function askQuestion() {
            tg.showAlert('Открой чат с Flint и задай вопрос');
        }

        function generateImage() {
            tg.showAlert('Скоро: генерация картинок');
        }

        function checkBalance() {
            tg.showAlert('Баланс: 100 токенов');
        }

        function openReferral() {
            tg.showAlert('Рефералка скоро появится');
        }

        function openHistory() {
            tg.showAlert('История скоро появится');
        }

        function goToDiscover() {
            tg.showAlert('Открытия скоро');
        }

        function goToGenerate() {
            tg.showAlert('Генерация скоро');
        }

        function goToSettings() {
            tg.showAlert('Настройки скоро');
        }
    </script>
</body>
</html>
