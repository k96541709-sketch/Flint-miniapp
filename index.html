<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flint</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Splash */
        #splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #splash img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Логотип */
        .logo {
            width: 200px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* Приветствие */
        .greeting {
            font-size: 28px;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Секции */
        .section-title {
            width: 100%;
            max-width: 400px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            margin-top: 10px;
        }

        /* Карточки */
        .card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.15);
        }
        .card-icon {
            font-size: 28px;
            flex-shrink: 0;
        }
        .card-text {
            flex: 1;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-subtitle {
            font-size: 13px;
            color: #ccc;
            line-height: 1.3;
        }
        .card-arrow {
            font-size: 20px;
            color: #888;
        }

        /* Навигация */
        .nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
            flex: 1;
        }
        .nav-item.active {
            opacity: 1;
        }
        .nav-icon {
            font-size: 24px;
        }
        .nav-label {
            font-size: 11px;
            color: #fff;
        }
        .nav-item.active .nav-label {
            color: #ff6b9d;
        }
    </style>
</head>
<body>

    <!-- Splash -->
    <div id="splash">
        <img src="start.jpg" alt="Flint">
    </div>

    <!-- Логотип -->
    <img src="logo.jpg" alt="FLINT" class="logo">

    <!-- Приветствие -->
    <div class="greeting" id="greeting">Привет!</div>

    <!-- Умная подборка -->
    <div class="section-title">Лучшее</div>
    <div id="recommendations"></div>

    <!-- Основное -->
    <div class="section-title" style="margin-top: 24px;">Основное</div>

    <div class="card" onclick="openReferral()">
        <div class="card-icon">🔗</div>
        <div class="card-text">
            <div class="card-title">Рефералка</div>
            <div class="card-subtitle">Приглашай друзей, получай токены</div>
        </div>
        <div class="card-arrow">›</div>
    </div>

    <div class="card" onclick="openHistory()">
        <div class="card-icon">📜</div>
        <div class="card-text">
            <div class="card-title">История</div>
            <div class="card-subtitle">Твои прошлые запросы</div>
        </div>
        <div class="card-arrow">›</div>
    </div>

    <!-- Навигация -->
    <div class="nav">
        <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Главная</div>
        </div>
        <div class="nav-item" onclick="goToDiscover()">
            <div class="nav-icon">🔍</div>
            <div class="nav-label">Открытия</div>
        </div>
        <div class="nav-item" onclick="goToGenerate()">
            <div class="nav-icon">🎨</div>
            <div class="nav-label">Генерация</div>
        </div>
        <div class="nav-item" onclick="goToSettings()">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label">Настройки</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Приветствие
        const user = tg.initDataUnsafe?.user;
        if (user && user.first_name) {
            document.getElementById('greeting').textContent = `Привет, ${user.first_name}!`;
        }

        // Умная подборка
        const hour = new Date().getHours();
        let recommendations = [];

        if (hour < 12) {
            recommendations.push({ icon: "☀️", title: "Доброе утро", subtitle: "Что нужно сделать сегодня?" });
        } else if (hour < 18) {
            recommendations.push({ icon: "💬", title: "Задай вопрос", subtitle: "Помогу разобраться" });
        } else {
            recommendations.push({ icon: "🌙", title: "Добрый вечер", subtitle: "Подведём итоги дня?" });
        }

        recommendations.push({ icon: "🎨", title: "Сгенерируй картинку", subtitle: "Опиши, что хочешь увидеть" });
        recommendations.push({ icon: "💰", title: "Твой баланс", subtitle: "100 токенов" });

        const container = document.getElementById('recommendations');
        recommendations.forEach(rec => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-icon">${rec.icon}</div>
                <div class="card-text">
                    <div class="card-title">${rec.title}</div>
                    <div class="card-subtitle">${rec.subtitle}</div>
                </div>
                <div class="card-arrow">›</div>
            `;
            container.appendChild(card);
        });

        // Splash
        setTimeout(() => {
            document.getElementById('splash').classList.add('hidden');
        }, 1500);

        // Кнопки
        function openReferral() { tg.showAlert('Рефералка'); }
        function openHistory() { tg.showAlert('История'); }
        function goToDiscover() { tg.showAlert('Открытия'); }
        function goToGenerate() { tg.showAlert('Генерация'); }
        function goToSettings() { tg.showAlert('Настройки'); }
    </script>
</body>
</html>
