<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flint</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: url('background.JPG') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('background.JPG') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .splash-logo {
            width: 200px;
            animation: splashPulse 1.5s ease-in-out infinite;
        }
        @keyframes splashPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .logo {
            width: 200px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .greeting {
            font-size: 28px;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .section-title {
            width: 100%;
            max-width: 400px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            margin-top: 10px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.15);
        }
        .card-icon {
            font-size: 28px;
            flex-shrink: 0;
        }
        .card-text {
            flex: 1;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-subtitle {
            font-size: 13px;
            color: #ccc;
            line-height: 1.3;
        }
        .card-arrow {
            font-size: 20px;
            color: #888;
        }

        .nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
            flex: 1;
        }
        .nav-item.active {
            opacity: 1;
        }
        .nav-icon {
            font-size: 24px;
        }
        .nav-label {
            font-size: 11px;
            color: #fff;
        }
        .nav-item.active .nav-label {
            color: #ff6b9d;
        }
    </style>
</head>
<body>

    <div id="splash">
        <img src="logo.PNG" alt="Flint" class="splash-logo">
    </div>

    <img src="logo.PNG" alt="FLINT" class="logo">

    <div class="greeting" id="greeting">Привет!</div>

    <div class="section-title" id="section-best">Лучшее</div>
    <div id="recommendations"></div>

    <div class="section-title" id="section-main" style="margin-top: 24px;">Основное</div>

    <div class="card" onclick="openReferral()">
        <div class="card-icon">🔗</div>
        <div class="card-text">
            <div class="card-title" id="ref-title">Рефералка</div>
            <div class="card-subtitle" id="ref-sub">Приглашай друзей, получай токены</div>
        </div>
        <div class="card-arrow">›</div>
    </div>

    <div class="card" onclick="openHistory()">
        <div class="card-icon">📜</div>
        <div class="card-text">
            <div class="card-title" id="hist-title">История</div>
            <div class="card-subtitle" id="hist-sub">Твои прошлые запросы</div>
        </div>
        <div class="card-arrow">›</div>
    </div>

    <div class="nav">
        <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            <div class="nav-label" id="nav-home">Главная</div>
        </div>
        <div class="nav-item" onclick="goToDiscover()">
            <div class="nav-icon">🔍</div>
            <div class="nav-label" id="nav-discover">Открытия</div>
        </div>
        <div class="nav-item" onclick="goToGenerate()">
            <div class="nav-icon">🎨</div>
            <div class="nav-label" id="nav-generate">Генерация</div>
        </div>
        <div class="nav-item" onclick="goToSettings()">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label" id="nav-settings">Настройки</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let lang = 'ru';

        const TEXTS = {
            ru: {
                greeting: 'Привет, {name}!',
                greetingNoName: 'Привет!',
                best: 'Лучшее',
                main: 'Основное',
                refTitle: 'Рефералка',
                refSub: 'Приглашай друзей, получай токены',
                histTitle: 'История',
                histSub: 'Твои прошлые запросы',
                navHome: 'Главная',
                navDiscover: 'Открытия',
                navGenerate: 'Генерация',
                navSettings: 'Настройки',
                morning: 'Доброе утро',
                morningSub: 'Что нужно сделать сегодня?',
                day: 'Задай вопрос',
                daySub: 'Помогу разобраться',
                evening: 'Добрый вечер',
                eveningSub: 'Подведём итоги дня?',
                generate: 'Сгенерируй картинку',
                generateSub: 'Опиши, что хочешь увидеть',
                balance: 'Твой баланс',
                balanceSub: '100 токенов'
            },
            en: {
                greeting: 'Hi, {name}!',
                greetingNoName: 'Hi!',
                best: 'Best',
                main: 'Main',
                refTitle: 'Referral',
                refSub: 'Invite friends, get tokens',
                histTitle: 'History',
                histSub: 'Your past requests',
                navHome: 'Home',
                navDiscover: 'Discover',
                navGenerate: 'Generate',
                navSettings: 'Settings',
                morning: 'Good morning',
                morningSub: 'What to do today?',
                day: 'Ask a question',
                daySub: 'I will help',
                evening: 'Good evening',
                eveningSub: 'Sum up the day?',
                generate: 'Generate image',
                generateSub: 'Describe what you want',
                balance: 'Your balance',
                balanceSub: '100 tokens'
            }
        };

        function t(key) {
            return TEXTS[lang][key] || key;
        }

        const user = tg.initDataUnsafe?.user;
        const name = user?.first_name || '';

        function renderGreeting() {
            document.getElementById('greeting').textContent = name
                ? t('greeting').replace('{name}', name)
                : t('greetingNoName');
        }

        function renderRecommendations() {
            const hour = new Date().getHours();
            let recs = [];

            if (hour < 12) {
                recs.push({ icon: "☀️", title: t('morning'), subtitle: t('morningSub') });
            } else if (hour < 18) {
                recs.push({ icon: "💬", title: t('day'), subtitle: t('daySub') });
            } else {
                recs.push({ icon: "🌙", title: t('evening'), subtitle: t('eveningSub') });
            }

            recs.push({ icon: "🎨", title: t('generate'), subtitle: t('generateSub') });
            recs.push({ icon: "💰", title: t('balance'), subtitle: t('balanceSub') });

            const container = document.getElementById('recommendations');
            container.innerHTML = '';
            recs.forEach(rec => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-icon">${rec.icon}</div>
                    <div class="card-text">
                        <div class="card-title">${rec.title}</div>
                        <div class="card-subtitle">${rec.subtitle}</div>
                    </div>
                    <div class="card-arrow">›</div>
                `;
                container.appendChild(card);
            });
        }

        function render() {
            renderGreeting();
            renderRecommendations();

            document.getElementById('section-best').textContent = t('best');
            document.getElementById('section-main').textContent = t('main');
            document.getElementById('ref-title').textContent = t('refTitle');
            document.getElementById('ref-sub').textContent = t('refSub');
            document.getElementById('hist-title').textContent = t('histTitle');
            document.getElementById('hist-sub').textContent = t('histSub');
            document.getElementById('nav-home').textContent = t('navHome');
            document.getElementById('nav-discover').textContent = t('navDiscover');
            document.getElementById('nav-generate').textContent = t('navGenerate');
            document.getElementById('nav-settings').textContent = t('navSettings');
        }

        render();

        setTimeout(() => {
            document.getElementById('splash').classList.add('hidden');
        }, 1500);

        function openReferral() { tg.showAlert(t('refTitle')); }
        function openHistory() { tg.showAlert(t('histTitle')); }
        function goToDiscover() { tg.showAlert(t('navDiscover')); }
        function goToGenerate() { tg.showAlert(t('navGenerate')); }
        function goToSettings() { tg.showAlert(t('navSettings')); }
    </script>
</body>
</html>
