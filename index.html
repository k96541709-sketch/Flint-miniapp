<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flint</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0a0a12;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 180, 100, 0.6), 0 0 40px rgba(255, 140, 60, 0.3);
            margin-top: 40px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #8888a0;
            font-size: 14px;
            margin-bottom: 40px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #15151f;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid #222230;
        }
        .balance-label {
            color: #8888a0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .balance-value {
            font-size: 36px;
            font-weight: 700;
            color: #ffb464;
            text-shadow: 0 0 15px rgba(255, 180, 100, 0.4);
        }
        .btn {
            width: 100%;
            max-width: 400px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ffb464, #ff8c3c);
            color: #0a0a12;
        }
        .btn-secondary {
            background: #222230;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="logo">FLINT</div>
    <div class="subtitle">AI with a spark</div>
    <div class="card">
        <div class="balance-label">Твой баланс</div>
        <div class="balance-value" id="balance">100 токенов</div>
    </div>
    <button class="btn btn-primary" onclick="topUp()">⭐ Пополнить</button>
    <button class="btn btn-secondary" onclick="showRef()">🔗 Рефералка</button>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        function topUp() {
            tg.showAlert('Оплата скоро появится');
        }
        function showRef() {
            tg.showAlert('Реферальная ссылка скоро появится');
        }
    </script>
</body>
</html>
